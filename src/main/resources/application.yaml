spring:
  application:
    name: ecommerce-api

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_db?useTimezone=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true